<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="160" r="130" fill="url(#emptyGrad)"/>
  <circle cx="200" cy="160" r="90" fill="rgba(99,102,241,0.05)"/>

  <!-- Magnifying Glass -->
  <circle cx="185" cy="148" r="55" fill="none"
    stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
  <circle cx="185" cy="148" r="38" fill="white"/>

  <!-- X inside glass -->
  <line x1="170" y1="133" x2="200" y2="163"
    stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="133" x2="170" y2="163"
    stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>

  <!-- Handle -->
  <line x1="228" y1="191" x2="258" y2="221"
    stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>

  <!-- Stars -->
  <text x="50"  y="80"  font-size="20" opacity="0.3">⭐</text>
  <text x="310" y="100" font-size="16" opacity="0.3">✨</text>
  <text x="80"  y="260" font-size="14" opacity="0.3">💫</text>
  <text x="320" y="250" font-size="18" opacity="0.3">⭐</text>

  <!-- Text -->
  <text x="200" y="285" text-anchor="middle"
    font-family="Inter, Arial" font-size="18"
    font-weight="700" fill="#374151">
    No results found
  </text>
  <text x="200" y="308" text-anchor="middle"
    font-family="Inter, Arial" font-size="13" fill="#9ca3af">
    Try adjusting your search or filters
  </text>
</svg>
